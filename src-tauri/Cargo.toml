[package]
name = "webees"
version = "0.1.0"
description = "Cross-platform desktop shell that hosts Telegram Web A in a native window."
authors = ["Webees contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "webees_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
