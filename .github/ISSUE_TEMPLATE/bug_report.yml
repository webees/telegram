name: Bug report
description: Report a defect in the desktop shell.
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux (WebKitGTK)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version, OS version, and webview version where known.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, phone numbers and session identifiers before pasting.
      render: shell
    validations:
      required: false
